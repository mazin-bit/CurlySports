<!-- Curly Sports – General Notification email template -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Notification</title>
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Syne', 'DM Sans', -apple-system, sans-serif; background-color: #121212; -webkit-font-smoothing: antialiased; color: #ffffff;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
        style="background-color: #121212; padding: 60px 20px;">
        <tr>
            <td align="center">
                <!-- Main Email Container -->
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
                    style="max-width: 480px; background: rgba(26, 26, 26, 0.95); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4); overflow: hidden;">

                    <!-- Header -->
                    <tr>
                        <td
                            style="padding: 32px 32px 24px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
                            <span
                                style="font-size: 28px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em;">Curly</span><span
                                style="font-size: 28px; font-weight: 800; color: #38bdf8; letter-spacing: -0.02em;">Sports</span>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding: 40px 32px; text-align: center;">

                            <!-- BRANDING IMAGE LOGO -->
                            <img src="https://ialexnohsrkrkmbnuqgd.supabase.co/storage/v1/object/public/public/curly-sports-mascot.png"
                                alt="Curly Sports Mascot"
                                style="height: 140px; margin-bottom: 24px; display: block; margin-left: auto; margin-right: auto;" />

                            <h1
                                style="margin: 0 0 16px; font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: -0.02em;">
                                Important Update</h1>
                            <p style="margin: 0 0 32px; font-size: 15px; line-height: 1.6; color: #a8a8a8;">
                                We have an important notification regarding your Curly Sports account.
                            </p>

                            <!-- Action Button -->
                            <table role="presentation" cellspacing="0" cellpadding="0" style="margin: 0 auto;">
                                <tr>
                                    <td
                                        style="border-radius: 12px; background: linear-gradient(135deg, #38bdf8, #6366f1); box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);">
                                        <a href="https://curlysports.com/dashboard" target="_blank" rel="noopener"
                                            style="display: inline-block; padding: 16px 32px; font-size: 16px; font-weight: 600; color: #ffffff; text-decoration: none; letter-spacing: 0.01em;">Go
                                            to Dashboard</a>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td
                            style="padding: 24px 32px; border-top: 1px solid rgba(255, 255, 255, 0.05); background: rgba(18, 18, 18, 0.4);">
                            <p
                                style="margin: 0; font-size: 12px; line-height: 1.5; color: #64748b; text-align: center;">
                                You’re receiving this because you signed up for Curly Sports.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
