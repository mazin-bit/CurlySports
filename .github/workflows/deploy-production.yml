name: Deploy Production to Vercel

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: "App version (example: v1.0.0)"
        default: "v1.0.0"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pull migration env
        id: migration-env
        run: |
          echo "::group::Pulling env from Vercel"
          vercel env pull .env.migrate --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          echo "::endgroup::"

          # Debug: show which env vars were pulled (values masked)
          echo "::group::Env vars pulled (keys only)"
          grep -oP '^[A-Z_]+(?==)' .env.migrate || echo "(no vars found)"
          echo "::endgroup::"

          # Debug: show raw DIRECT_URL and DATABASE_URL lines (mask passwords)
          echo "::group::Database URL diagnostics"
          grep -E '^(DIRECT_URL|DATABASE_URL)=' .env.migrate | sed 's/:\/\/[^:]*:[^@]*@/:\/\/***:***@/g' || echo "(neither DIRECT_URL nor DATABASE_URL found)"
          echo "::endgroup::"

          # Migrations need a direct (non-pgbouncer) connection on port 5432.
          sed -i 's|\.pooler\.supabase\.com:6543/|.pooler.supabase.com:5432/|g' .env.migrate
          sed -i '/^DIRECT_URL=/s/?pgbouncer=true//' .env.migrate

          # Check DIRECT_URL first, fall back to DATABASE_URL
          DIRECT_URL_LINE=$(grep -m1 '^DIRECT_URL=' .env.migrate || true)
          DIRECT_URL_VAL="${DIRECT_URL_LINE#DIRECT_URL=}"
          DIRECT_URL_VAL=$(echo "$DIRECT_URL_VAL" | sed 's/^"//;s/"$//')

          DATABASE_URL_LINE=$(grep -m1 '^DATABASE_URL=' .env.migrate || true)
          DATABASE_URL_VAL="${DATABASE_URL_LINE#DATABASE_URL=}"
          DATABASE_URL_VAL=$(echo "$DATABASE_URL_VAL" | sed 's/^"//;s/"$//')

          if [ -n "$DIRECT_URL_VAL" ]; then
            echo "has_direct_url=true" >> "$GITHUB_OUTPUT"
            echo "Using DIRECT_URL for migrations"
          elif [ -n "$DATABASE_URL_VAL" ]; then
            echo "::notice::DIRECT_URL is empty but DATABASE_URL exists — using DATABASE_URL for migrations"
            echo "DIRECT_URL=$DATABASE_URL_VAL" >> .env.migrate
            echo "has_direct_url=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither DIRECT_URL nor DATABASE_URL is set — cannot run migrations. Add DATABASE_URL to Vercel env vars."
            echo "has_direct_url=false" >> "$GITHUB_OUTPUT"
            rm -f .env.migrate
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run Prisma migrations
        if: steps.migration-env.outputs.has_direct_url == 'true'
        run: |
          # Show which database host Prisma will connect to (password is not printed).
          echo "::group::Migration connection info"
          node --env-file=.env.migrate -e "
            const d = process.env.DIRECT_URL || '';
            const db = process.env.DATABASE_URL || '';
            console.log('[migrate] DIRECT_URL:', d ? d.replace(/:([^:@]+)@/, ':***@') : '(empty)');
            console.log('[migrate] DATABASE_URL:', db ? db.replace(/:([^:@]+)@/, ':***@') : '(empty)');
          "
          echo "::endgroup::"

          # Check pending migrations
          echo "::group::Prisma migrate status"
          node --env-file=.env.migrate ./node_modules/.bin/prisma migrate status || true
          echo "::endgroup::"

          # Apply all pending Prisma migrations
          echo "::group::Running prisma migrate deploy"
          node --env-file=.env.migrate ./node_modules/.bin/prisma migrate deploy
          MIGRATE_EXIT=$?
          echo "::endgroup::"

          if [ $MIGRATE_EXIT -ne 0 ]; then
            echo "::error::Prisma migration failed (exit code $MIGRATE_EXIT) — deploy aborted."
            rm -f .env.migrate
            exit 1
          fi

          echo "Prisma migrations applied successfully"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run Supabase SQL migrations
        if: steps.migration-env.outputs.has_direct_url == 'true'
        run: |
          sudo apt-get install -y -q postgresql-client 2>/dev/null

          # Extract the direct DB connection URL
          MIGRATE_URL=$(grep -m1 '^DIRECT_URL=' .env.migrate | sed 's/^DIRECT_URL=//' | tr -d '"')

          echo "::group::Supabase SQL migrations"
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            echo "Applying $f ..."
            psql "$MIGRATE_URL" -f "$f" -v ON_ERROR_STOP=0 2>&1 | grep -v "^$" || true
            echo "  done"
          done
          echo "::endgroup::"

          rm -f .env.migrate
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_VERSION: ${{ inputs.app-version }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        run: |
          echo "### Deployed \`${{ github.ref_name }}\` @ \`${{ inputs.app-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
