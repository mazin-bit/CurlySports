name: Deploy Production to Vercel

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: "App version (example: v1.0.0)"
        default: "v1.0.0"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare migration URL
        id: migration-env
        run: |
          # vercel env pull masks sensitive vars as [SENSITIVE], so use GitHub secret directly.
          MIGRATE_URL="${{ secrets.DIRECT_DATABASE_URL }}"

          if [ -z "$MIGRATE_URL" ]; then
            echo "::error::DIRECT_DATABASE_URL secret is not set. Add it to GitHub repo secrets (Settings > Secrets > Actions)."
            echo "::error::Use the direct (non-pooler) Supabase connection string on port 5432."
            echo "has_url=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure direct connection: port 5432, no pgbouncer
          MIGRATE_URL=$(echo "$MIGRATE_URL" | sed 's|\.pooler\.supabase\.com:6543/|.pooler.supabase.com:5432/|g')
          MIGRATE_URL=$(echo "$MIGRATE_URL" | sed 's/[?&]pgbouncer=true//g')

          # Write .env.migrate for Prisma
          echo "DATABASE_URL=$MIGRATE_URL" > .env.migrate
          echo "DIRECT_URL=$MIGRATE_URL" >> .env.migrate

          # Verify scheme
          SCHEME=$(echo "$MIGRATE_URL" | grep -oP '^[a-z]+(?=://)' || true)
          if [ -z "$SCHEME" ]; then
            echo "::error::DIRECT_DATABASE_URL has no valid scheme (expected postgresql:// or postgres://)"
            echo "has_url=false" >> "$GITHUB_OUTPUT"
          else
            echo "Using DIRECT_DATABASE_URL (scheme: $SCHEME)"
            echo "has_url=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Prisma migrations
        if: steps.migration-env.outputs.has_url == 'true'
        run: node scripts/run-migrations.js

      - name: Run Supabase SQL migrations
        if: steps.migration-env.outputs.has_url == 'true'
        run: |
          sudo apt-get install -y -q postgresql-client 2>/dev/null

          MIGRATE_URL=$(grep -m1 '^DIRECT_URL=' .env.migrate | sed 's/^DIRECT_URL=//' | tr -d '"')

          echo "::group::Supabase SQL migrations"
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            echo "Applying $f ..."
            psql "$MIGRATE_URL" -f "$f" -v ON_ERROR_STOP=0 2>&1 | grep -v "^$" || true
            echo "  done"
          done
          echo "::endgroup::"

          rm -f .env.migrate

      - name: Export NEXT_PUBLIC env vars for build
        run: |
          # vercel build in CI doesn't inject NEXT_PUBLIC_* vars into the Next.js build.
          # Read them from the pulled env file and export them.
          ENV_FILE=".vercel/.env.production.local"
          if [ -f "$ENV_FILE" ]; then
            while IFS='=' read -r key value; do
              # Only export NEXT_PUBLIC_ vars (they're safe — already public in client bundle)
              if [[ "$key" == NEXT_PUBLIC_* ]]; then
                # Strip surrounding quotes if present
                value=$(echo "$value" | sed 's/^"//;s/"$//')
                echo "${key}=${value}" >> "$GITHUB_ENV"
              fi
            done < "$ENV_FILE"
            echo "Exported NEXT_PUBLIC_* vars from $ENV_FILE"
          else
            echo "::warning::$ENV_FILE not found — NEXT_PUBLIC_* vars may be missing from build"
          fi

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_VERSION: ${{ inputs.app-version }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        run: |
          echo "### Deployed \`${{ github.ref_name }}\` @ \`${{ inputs.app-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
